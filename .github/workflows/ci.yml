name: SwiftRouteOS CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Backend Testing & Verification
  # ============================================================================
  backend-test:
    name: Backend (Java 21 / Spring Boot / PostgreSQL / Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: swiftroute_db
          POSTGRES_USER: swiftroute
          POSTGRES_PASSWORD: swiftroute_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ensure Maven Wrapper is Executable
        run: chmod +x backend/mvnw

      - name: Execute Backend Tests & Concurrency Chaos Verification
        working-directory: backend
        run: ./mvnw test -B
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: swiftroute_db
          DB_USER: swiftroute
          DB_PASSWORD: swiftroute_secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

      - name: Publish Test Report Artifacts (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # Job 2: Frontend Linting & Production Build
  # ============================================================================
  frontend-build:
    name: Frontend (Node 22 / TypeScript / Vite / Oxlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Static Code Analysis & Linter
        working-directory: frontend
        run: npm run lint

      - name: Compile TypeScript & Build Production Bundle
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # Job 3: Docker Compose & Image Build Smoke Validation
  # ============================================================================
  docker-smoke-test:
    name: Container Build & Compose Validation
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: swiftroute-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: swiftroute-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
